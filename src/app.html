<!doctype html>
<html lang="en" dir="ltr" style="--app-bg: #2e2e2e; background-color: #2e2e2e">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <!--<link rel="icon" type="image/svg+xml" href="./favicon.png" />-->
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content, target-densitydpi=low-dpi, shrink-to-fit=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="text-scale" content="scale" />
    <meta name="color-scheme" content="dark light" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#ffe06a" />
    <!--<meta http-equiv="Content-Security-Policy" content="default-src 'self'" />-->
    <meta
      name="format-detection"
      content="telephone=no,date=no,email=no,address=no,url=no"
    />
    <style>
      :root,
      html,
      body {
        font-size: 100%;

        -ms-overflow-style: none;
        scrollbar-width: none;

        /*TODO: overscroll-behavior*/
      }
      *::-webkit-scrollbar {
        display: none; /* Older Safari and Chromium */
      }

      body:not(.fonts-loaded) {
        opacity: 0;
        pointer-events: none;
      }
      body {
        transition: opacity 0.22s ease-in-out;
      }

      html,
      body {
        padding: 0;
        margin: 0;
      }
      html {
        height: 100%;
      }
      body {
        min-height: 100%;
      }

      html,
      body,
      body * {
        box-sizing: border-box;
      }

      :root,
      html,
      body {
        color-scheme: normal;
        background-color: #2e2e2e;
        color: #f0f0f0;

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
          "Segoe UI Symbol";
      }

      input,
      button,
      select {
        font-size: 1rem;
        font-family: inherit;
        border: none;
      }

      :root,
      html,
      body,
      a,
      input,
      button,
      select {
        -webkit-tap-highlight-color: transparent;

        -webkit-touch-callout: none;

        /* TODO: do this only on Android? */
        -webkit-user-drag: none;

        /*-webkit-user-select: none;
				-khtml-user-select: none;
				-moz-user-select: none;
				-ms-user-select: none;
				user-select: none;*/
      }
    </style>
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="false"
    class=""
    data-version="%sveltekit.version%"
    style="background-color: var(--app-bg)"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
