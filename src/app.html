<!doctype html>
<html lang="en" dir="ltr" style="background-color: #2e2e2e">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <!--<link rel="icon" type="image/svg+xml" href="./favicon.png" />-->
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content, target-densitydpi=low-dpi, shrink-to-fit=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="text-scale" content="scale" />
    <meta name="color-scheme" content="dark light" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#ffe06a" />
    <!--<meta http-equiv="Content-Security-Policy" content="default-src 'self'" />-->
    <meta
      name="format-detection"
      content="telephone=no,date=no,email=no,address=no,url=no"
    />
    <style>
      :root,
      html,
      body {
        color-scheme: normal;
        background-color: #2e2e2e;
        color: #f0f0f0;

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
          "Segoe UI Symbol";
      }
      :root,
      html,
      body {
        -webkit-tap-highlight-color: transparent;

        -webkit-touch-callout: none;

        /*-webkit-user-select: none;
				-khtml-user-select: none;
				-moz-user-select: none;
				-ms-user-select: none;
				user-select: none;*/
      }
      a {
        color: #8080fe;
      }
    </style>
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    data-version="%sveltekit.version%"
    style="background-color: #2e2e2e"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
